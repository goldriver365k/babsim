[build]
  publish = "."
  command = ""
  functions = "netlify/functions"

  # GEMINI_API_KEY는 netlify/functions/parse-weekly-menu.js 안에서
  # process.env로만 읽고, 어떤 저장소 파일이나 클라이언트 번들에도 실제
  # 값을 적어두지 않습니다(레포 전체 검색으로 확인됨). REVIEW_ID는 이
  # 저장소에서 전혀 참조하지 않는 Netlify 내부 컨텍스트 값(배포 프리뷰의
  # PR 번호 등)으로, 값이 짧아 저장소 아무 파일과 우연히 겹치기 쉽습니다.
  # publish가 저장소 루트(".")라서 Netlify의 비밀값 검사(secrets scanning)가
  # 이런 우연한 부분 일치를 실제 노출로 오판해 빌드를 계속 막았습니다.
  # OMIT_KEYS만으로는 "smart detection"(휴리스틱) 검사까지는 막히지 않아
  # 계속 실패했으므로, 두 검사 방식 모두에 대해 이 두 값을 제외합니다.
[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "GEMINI_API_KEY,REVIEW_ID"
  SECRETS_SCAN_SMART_DETECTION_OMIT_VALUES = "GEMINI_API_KEY,REVIEW_ID"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Content-Type = "text/html; charset=UTF-8"

[[headers]]
  for = "/*.html"
  [headers.values]
    Content-Type = "text/html; charset=UTF-8"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"
