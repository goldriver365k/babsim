[build]
  publish = "."
  command = ""
  functions = "netlify/functions"

  # GEMINI_API_KEY는 netlify/functions/parse-weekly-menu.js 안에서
  # process.env로만 읽고, 어떤 저장소 파일이나 클라이언트 번들에도 실제
  # 값을 적어두지 않습니다(레포 전체 검색으로 확인됨). REVIEW_ID는 이
  # 저장소에 저장소에서 전혀 참조하지 않는 Netlify 내부 컨텍스트 값입니다.
  # publish가 저장소 루트(".")라서 Netlify의 비밀값 검사(secrets scanning)가
  # 두 값의 우연한 부분 일치를 오탐(false positive)으로 잡아 빌드를 막는
  # 문제가 있어, 이 두 값만 검사 대상에서 제외합니다(값이 실제로 안전하게
  # 서버에서만 쓰이는지는 위 주석과 코드로 계속 확인하세요).
[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "GEMINI_API_KEY,REVIEW_ID"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Content-Type = "text/html; charset=UTF-8"

[[headers]]
  for = "/*.html"
  [headers.values]
    Content-Type = "text/html; charset=UTF-8"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"
