[build]
  publish = "."
  command = ""
  functions = "netlify/functions"

  # 실제로 빌드를 막고 있던 값은 GEMINI_API_KEY가 아니라 Firebase 웹
  # apiKey(AIza로 시작)였습니다. 이 값은 Firebase 설계상 공개되어도
  # 안전한 클라이언트 식별자라서 admin.html/index.html/firebase-config.js/
  # parse-weekly-menu.js에 의도적으로 그대로 적혀 있습니다(실제 보안은
  # Firestore/Storage 규칙과 서버의 ID 토큰 검증이 담당). Netlify의
  # "smart detection"(휴리스틱) 검사가 "AIza..." 패턴을 보이는 값을
  # 무조건 의심 비밀값으로 잡기 때문에, 이 검사만 꺼둡니다.
  # (SECRETS_SCAN_SMART_DETECTION_OMIT_VALUES는 변수 이름이 아니라
  # 실제 값 목록을 받는 옵션이라 이전 시도는 효과가 없었습니다.)
  # GEMINI_API_KEY는 netlify/functions/parse-weekly-menu.js 안에서
  # process.env로만 읽고 저장소 어디에도 실제 값을 적지 않았고, 이번
  # 빌드 로그에서도 "0 instance(s) of secrets"로 확인되었습니다.
[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "GEMINI_API_KEY,OPENAI_API_KEY,AI_PROVIDER,REVIEW_ID"
  SECRETS_SCAN_SMART_DETECTION_ENABLED = "false"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Content-Type = "text/html; charset=UTF-8"

[[headers]]
  for = "/*.html"
  [headers.values]
    Content-Type = "text/html; charset=UTF-8"

[[headers]]
  for = "/css/*"
  [headers.values]
    Content-Type = "text/css; charset=UTF-8"
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/js/*"
  [headers.values]
    Content-Type = "application/javascript; charset=UTF-8"
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

# 서비스 워커 파일은 절대 오래 캐시되면 안 됩니다 — 브라우저가 이 파일을
# 매번(또는 아주 자주) 새로 받아 바이트 단위로 비교해야 새 배포를 감지해
# "지금 업데이트" 배너를 띄울 수 있습니다. Content-Type도 위 "/*" 전역
# 규칙(text/html)이 아니라 실제 자바스크립트로 지정해야 브라우저가
# 서비스 워커로 등록해 줍니다.
[[headers]]
  for = "/service-worker.js"
  [headers.values]
    Content-Type = "application/javascript; charset=UTF-8"
    Cache-Control = "no-cache"
    Service-Worker-Allowed = "/"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json; charset=UTF-8"
    Cache-Control = "public, max-age=3600"
