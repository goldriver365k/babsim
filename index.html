<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>푸드홀(인제대학교)</title>
<meta name="description" content="인제대학교 푸드홀 - 밥심, 만권화밥, 후루룩찹찹 온라인 메뉴판">

<!-- 홈 화면 추가(PWA) 아이콘 -->
<link rel="manifest" href="./manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="./images/icon/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="./images/icon/favicon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="./images/icon/apple-touch-icon.png">
<meta name="theme-color" content="#1957d6">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="푸드홀">
<style>
/* ==========================================================================
   푸드홀(인제대학교) — 키오스크 스타일 정적 메뉴판
   색상: 흰 배경 + 파란색 포인트, 회색 테두리. 그라데이션/과도한 그림자 없음.
   ========================================================================== */

:root {
  --blue: #1957d6;
  --blue-dark: #123f9e;
  --border-gray: #d3d7de;
  --text-dark: #1f2328;
  --text-mid: #4b5563;
  --bg-page: #f4f5f7;
  --bg-card: #ffffff;
  --red: #d92626;
  --radius-sm: 6px;
  --radius-md: 10px;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  overflow-x: hidden;
}

body {
  font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", -apple-system, BlinkMacSystemFont, sans-serif;
  background: var(--bg-page);
  color: var(--text-dark);
  font-size: 16px;
  line-height: 1.5;
}

button {
  font-family: inherit;
  cursor: pointer;
}

/* ---------------- 헤더 (고정) ---------------- */

.site-header {
  position: sticky;
  top: 0;
  z-index: 50;
  background: #ffffff;
  border-bottom: 1px solid var(--border-gray);
  padding: 14px 16px 12px;
}

.header-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 10px;
  max-width: 1200px;
  margin: 0 auto 12px;
}

.site-title {
  font-size: 22px;
  font-weight: 800;
  color: var(--blue);
  margin: 0;
  letter-spacing: -0.01em;
}

.lang-select {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}

.lang-btn {
  background: none;
  border: none;
  padding: 6px 4px;
  min-height: 44px;
  font-size: 15px;
  color: var(--text-mid);
  border-radius: var(--radius-sm);
}

.lang-btn:hover,
.lang-btn:focus-visible {
  color: var(--blue);
  outline: 2px solid var(--blue);
  outline-offset: 2px;
}

.lang-btn.active {
  color: var(--blue);
  font-weight: 700;
}

.lang-sep {
  color: var(--border-gray);
}

.store-tabs {
  display: flex;
  gap: 10px;
  overflow-x: auto;
  max-width: 1200px;
  margin: 0 auto;
  padding-bottom: 2px;
  scrollbar-width: thin;
}

.store-tab {
  flex: 0 0 auto;
  min-width: 128px;
  min-height: 84px;
  padding: 10px 14px;
  background: #ffffff;
  border: 1px solid var(--border-gray);
  border-radius: var(--radius-sm);
  color: var(--text-dark);
  text-align: center;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
}

.store-tab-brand {
  font-size: 17px;
  font-weight: 800;
  line-height: 1.25;
  overflow-wrap: anywhere;
}

.store-tab-floor {
  font-size: 13px;
  font-weight: 600;
  color: var(--text-mid);
  line-height: 1.2;
  overflow-wrap: anywhere;
}

.store-tab-pronunciation {
  font-size: 12px;
  font-weight: 400;
  color: #9aa1ab;
  line-height: 1.2;
  overflow-wrap: anywhere;
}

.store-tab.active .store-tab-floor {
  color: rgba(255, 255, 255, 0.85);
}

.store-tab.active .store-tab-pronunciation {
  color: rgba(255, 255, 255, 0.8);
}

.store-tab:focus-visible {
  outline: 2px solid var(--blue);
  outline-offset: 2px;
}

.store-tab.active {
  background: var(--blue);
  border-color: var(--blue);
  color: #ffffff;
}

@media (min-width: 700px) {
  .store-tabs { justify-content: center; overflow-x: visible; }
}

/* ---------------- 무료 콜라 쿠폰 배너 ---------------- */

.cola-banner {
  display: flex;
  align-items: center;
  gap: 12px;
  max-width: 1200px;
  margin: 14px auto 0;
  padding: 12px 14px;
  background: #ffffff;
  border: 2px solid var(--red);
  border-radius: var(--radius-md);
}

.cola-banner[hidden] { display: none; }

.cola-banner-icon {
  width: 44px;
  height: 44px;
  object-fit: contain;
  flex: 0 0 auto;
  border-radius: var(--radius-sm);
  background: #f7f8fa;
}

.cola-banner-text {
  flex: 1 1 auto;
  min-width: 0;
}

.cola-banner-title {
  margin: 0;
  font-size: 18px;
  font-weight: 800;
  color: var(--red);
  overflow-wrap: anywhere;
}

.cola-banner-subtitle {
  margin: 2px 0 0;
  font-size: 13px;
  color: var(--text-mid);
  overflow-wrap: anywhere;
}

.cola-banner-btn {
  flex: 0 0 auto;
  min-height: 44px;
  padding: 8px 16px;
  background: var(--red);
  color: #ffffff;
  border: none;
  border-radius: var(--radius-sm);
  font-size: 14px;
  font-weight: 700;
  white-space: nowrap;
}

.cola-banner-btn:hover,
.cola-banner-btn:focus-visible {
  background: #b81f1f;
  outline: 2px solid var(--red);
  outline-offset: 2px;
}

@media (max-width: 480px) {
  .cola-banner { flex-wrap: wrap; }
  .cola-banner-btn { width: 100%; }
}

/* ---------------- 콜라 쿠폰 상세창 ---------------- */

.cola-modal-title {
  color: var(--red);
}

.cola-stores-list {
  margin: 0;
  padding-left: 20px;
  font-size: 14px;
  color: var(--text-mid);
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.cola-plain-value {
  margin: 0;
  font-size: 14px;
  color: var(--text-mid);
  overflow-wrap: anywhere;
}

.cola-modal-actions {
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin-top: 20px;
}

.cola-show-btn {
  min-height: 44px;
  padding: 10px 16px;
  background: var(--red);
  color: #ffffff;
  border: none;
  border-radius: var(--radius-sm);
  font-size: 15px;
  font-weight: 700;
}

.cola-show-btn:hover,
.cola-show-btn:focus-visible {
  background: #b81f1f;
  outline: 2px solid var(--red);
  outline-offset: 2px;
}

/* ---------------- 직원에게 보여주기 화면 ---------------- */

.staff-show-overlay {
  position: fixed;
  inset: 0;
  background: var(--red);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  z-index: 200;
}

.staff-show-overlay[hidden] { display: none; }

.staff-show-close {
  position: absolute;
  top: 14px;
  right: 14px;
  width: 44px;
  height: 44px;
  background: none;
  border: 2px solid #ffffff;
  border-radius: 50%;
  color: #ffffff;
  font-size: 24px;
  line-height: 1;
}

.staff-show-close:hover,
.staff-show-close:focus-visible {
  background: rgba(255, 255, 255, 0.15);
  outline: none;
}

.staff-show-card {
  background: #ffffff;
  border-radius: var(--radius-md);
  max-width: 420px;
  width: 100%;
  padding: 40px 26px;
  text-align: center;
}

.staff-show-title {
  margin: 0 0 14px;
  font-size: 34px;
  font-weight: 900;
  color: var(--red);
  overflow-wrap: anywhere;
}

.staff-show-subtitle {
  margin: 0 0 24px;
  font-size: 16px;
  color: var(--text-dark);
  overflow-wrap: anywhere;
}

.staff-show-field {
  display: flex;
  flex-direction: column;
  gap: 4px;
  margin-bottom: 18px;
}

.staff-show-label {
  font-size: 13px;
  font-weight: 700;
  color: var(--text-mid);
}

.staff-show-value {
  font-size: 20px;
  font-weight: 800;
  color: var(--text-dark);
  overflow-wrap: anywhere;
}

.staff-show-period {
  margin: 0;
  font-size: 15px;
  font-weight: 700;
  color: var(--red);
}

/* ---------------- 사장님께 말해요 ---------------- */

.owner-chat-banner {
  max-width: 1200px;
  margin: 32px auto 0;
  padding: 22px 18px 26px;
  border-top: 1px solid var(--border-gray);
  text-align: center;
}

.owner-chat-title {
  margin: 0 0 8px;
  font-size: 18px;
  font-weight: 800;
  color: var(--text-dark);
}

.owner-chat-desc {
  margin: 0 0 4px;
  font-size: 14px;
  color: var(--text-mid);
  overflow-wrap: anywhere;
}

.owner-chat-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: 44px;
  margin-top: 16px;
  padding: 10px 24px;
  background: #FEE500;
  color: #3A1E1E;
  border-radius: var(--radius-sm);
  font-size: 15px;
  font-weight: 700;
  text-decoration: none;
  overflow-wrap: anywhere;
}

.owner-chat-btn:hover,
.owner-chat-btn:focus-visible {
  background: #f5d800;
  outline: 2px solid #3A1E1E;
  outline-offset: 2px;
}

@media (max-width: 480px) {
  .owner-chat-btn { width: 100%; }
}

.owner-chat-fab {
  display: none;
  position: fixed;
  right: 16px;
  bottom: 16px;
  z-index: 40;
  align-items: center;
  gap: 6px;
  min-height: 44px;
  padding: 10px 16px;
  background: #FEE500;
  color: #3A1E1E;
  border-radius: 999px;
  font-size: 13px;
  font-weight: 700;
  text-decoration: none;
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.18);
  max-width: calc(100vw - 32px);
  overflow-wrap: anywhere;
}

.owner-chat-fab:hover,
.owner-chat-fab:focus-visible {
  background: #f5d800;
  outline: 2px solid #3A1E1E;
  outline-offset: 2px;
}

@media (max-width: 700px) {
  .owner-chat-fab { display: inline-flex; }
}

/* ---------------- 본문 ---------------- */

main {
  max-width: 1200px;
  margin: 0 auto;
  padding: 20px 16px 60px;
}

.store-heading {
  font-size: 19px;
  font-weight: 700;
  color: var(--blue);
  margin: 4px 0 18px;
}

/* ---------------- 밥심 서브탭 (일반 메뉴 / 천원의 아침밥) ---------------- */

.bapsim-subtabs {
  display: flex;
  gap: 8px;
  margin-bottom: 18px;
}

.bapsim-subtabs[hidden] { display: none; }

.bapsim-subtab {
  flex: 1 1 0;
  min-height: 44px;
  padding: 10px 14px;
  background: #ffffff;
  border: 1px solid var(--border-gray);
  border-radius: var(--radius-sm);
  color: var(--text-mid);
  font-size: 15px;
  font-weight: 700;
  text-align: center;
  overflow-wrap: anywhere;
}

.bapsim-subtab:focus-visible {
  outline: 2px solid var(--blue);
  outline-offset: 2px;
}

.bapsim-subtab.active {
  background: var(--blue);
  border-color: var(--blue);
  color: #ffffff;
}

/* ---------------- 천원의 아침밥 전용 영역 ---------------- */

.breakfast-area {
  position: relative;
  background: #ffffff;
  border: 1px solid var(--blue);
  border-radius: var(--radius-md);
  overflow: hidden;
  padding: 22px 18px 24px;
  text-align: center;
}

.breakfast-area[hidden] { display: none; }

.ba-top-strip {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 6px;
  background: var(--blue);
}

.ba-title {
  margin: 8px 0 4px;
  font-size: 20px;
  font-weight: 800;
  color: var(--blue-dark);
  overflow-wrap: anywhere;
}

.ba-price {
  margin: 0 0 6px;
  font-size: 34px;
  font-weight: 900;
  color: var(--blue);
  line-height: 1.2;
}

.ba-block {
  max-width: 480px;
  margin: 0 auto 20px;
  padding-top: 18px;
  border-top: 1px solid var(--border-gray);
  text-align: left;
}

.ba-block:first-of-type {
  border-top: none;
  padding-top: 0;
}

.ba-block-title {
  margin: 0 0 12px;
  font-size: 16px;
  font-weight: 800;
  color: var(--text-dark);
  text-align: center;
}

.ba-label {
  display: block;
  font-size: 12px;
  font-weight: 700;
  color: var(--text-mid);
  margin-bottom: 4px;
}

.ba-value {
  margin: 0;
  font-size: 16px;
  color: var(--text-dark);
  overflow-wrap: anywhere;
}

.ba-list {
  margin: 0;
  padding-left: 20px;
  display: flex;
  flex-direction: column;
  gap: 6px;
  font-size: 15px;
  color: var(--text-dark);
}

.ba-list li {
  overflow-wrap: anywhere;
  white-space: pre-line;
}

.ba-steps-list {
  counter-reset: ba-step;
  padding-left: 0;
  list-style: none;
}

.ba-steps-list li {
  counter-increment: ba-step;
  position: relative;
  border: 1px solid var(--border-gray);
  border-radius: var(--radius-sm);
  padding: 10px 12px 10px 42px;
  font-size: 14px;
}

.ba-steps-list li::before {
  content: counter(ba-step);
  position: absolute;
  left: 10px;
  top: 50%;
  transform: translateY(-50%);
  width: 20px;
  height: 20px;
  border-radius: 50%;
  background: var(--blue);
  color: #ffffff;
  font-size: 12px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* ---- 오늘 · 내일 아침 메뉴 카드 ---- */

.ba-meal-cards {
  display: grid;
  grid-template-columns: 1fr;
  gap: 16px;
  max-width: 760px;
  margin: 0 auto 20px;
}

@media (min-width: 720px) {
  .ba-meal-cards { grid-template-columns: 1fr 1fr; }
}

.ba-meal-card {
  text-align: left;
  border-radius: var(--radius-sm);
  padding: 16px;
}

.ba-meal-card-today {
  background: #ffffff;
  border: 2px solid var(--blue);
}

.ba-meal-card-tomorrow {
  background: #eef2fa;
  border: 1px solid var(--border-gray);
}

.ba-meal-card-title {
  margin: 0 0 4px;
  font-size: 17px;
  font-weight: 800;
  text-align: center;
  overflow-wrap: anywhere;
}

.ba-meal-card-today .ba-meal-card-title {
  color: var(--blue-dark);
  font-size: 18px;
}

.ba-meal-card-tomorrow .ba-meal-card-title {
  color: var(--text-mid);
  font-size: 16px;
}

.ba-meal-card-date {
  margin: 0 0 12px;
  font-size: 13px;
  font-weight: 600;
  color: var(--text-mid);
  text-align: center;
}

.ba-today-meal {
  margin: 0;
  padding-left: 20px;
  list-style: disc;
  display: flex;
  flex-direction: column;
  gap: 6px;
  font-size: 16px;
  color: var(--text-dark);
}

.ba-meal-card-today .ba-today-meal li {
  font-size: 17px;
  font-weight: 600;
}

.ba-meal-card-tomorrow .ba-today-meal li {
  font-size: 16px;
  color: var(--text-mid);
}

.ba-today-meal li {
  overflow-wrap: anywhere;
}

.today-meal-closed {
  margin: 0;
  font-size: 15px;
  color: var(--text-mid);
  text-align: center;
  list-style: none;
}

.ba-view-original-btn {
  min-height: 44px;
  padding: 10px 20px;
  background: #ffffff;
  border: 1px solid var(--blue);
  border-radius: var(--radius-sm);
  color: var(--blue);
  font-size: 14px;
  font-weight: 700;
  margin-top: 4px;
}

.ba-view-original-btn[hidden] { display: none; }

.ba-view-original-btn:hover,
.ba-view-original-btn:focus-visible {
  background: var(--blue);
  color: #ffffff;
  outline: none;
}

/* ---- 오늘의 메뉴 평가 (천원의 아침밥) ---- */

.ba-rating {
  max-width: 480px;
  margin: 0 auto 20px;
  padding-top: 18px;
  border-top: 1px solid var(--border-gray);
}

.ba-rating[hidden] { display: none; }

.ba-rating-title {
  margin: 0 0 14px;
  font-size: 17px;
  font-weight: 800;
  color: var(--text-dark);
  text-align: center;
}

.ba-rating-title[hidden] { display: none; }

.ba-rating-options {
  display: flex;
  justify-content: center;
  gap: 6px;
}

.ba-rating-options[hidden] { display: none; }

.ba-rating-option {
  flex: 1 1 0;
  min-width: 0;
  min-height: 76px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 6px;
  background: #ffffff;
  border: 1px solid var(--border-gray);
  border-radius: var(--radius-sm);
  padding: 8px 2px;
}

.ba-rating-option:hover:not(:disabled),
.ba-rating-option:focus-visible {
  border-color: var(--blue);
  outline: none;
}

.ba-rating-option:active:not(:disabled) {
  background: #eef2fa;
}

.ba-rating-option:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

.ba-rating-face {
  width: 40px;
  height: 40px;
  display: block;
}

.ba-rating-face svg {
  width: 100%;
  height: 100%;
  display: block;
}

.ba-rating-label {
  font-size: 11px;
  font-weight: 600;
  color: var(--text-mid);
  line-height: 1.2;
  text-align: center;
  overflow-wrap: anywhere;
}

.ba-rating-message {
  margin: 0;
  padding: 18px 12px;
  text-align: center;
  font-size: 16px;
  font-weight: 700;
  border-radius: var(--radius-sm);
}

.ba-rating-message[hidden] { display: none; }

.ba-rating-message-completed {
  color: var(--text-mid);
  background: #f4f5f7;
}

.ba-rating-message-thanks {
  color: var(--blue-dark);
  background: #eef2fa;
}

.ba-rating-message-error {
  margin-top: 10px;
  color: var(--red);
  background: #fdecec;
  font-size: 13px;
  font-weight: 600;
  padding: 10px 12px;
}

@media (min-width: 420px) {
  .ba-rating-face { width: 48px; height: 48px; }
  .ba-rating-label { font-size: 12px; }
}

.weekly-image-modal {
  max-width: 92vw;
  max-height: 90vh;
  padding: 20px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.weekly-image-modal img {
  max-width: 100%;
  max-height: 78vh;
  object-fit: contain;
  border-radius: var(--radius-sm);
}

.menu-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 16px;
}

.menu-grid[hidden] { display: none; }

@media (min-width: 640px) {
  .menu-grid { grid-template-columns: repeat(3, 1fr); }
}

@media (min-width: 1000px) {
  .menu-grid { grid-template-columns: repeat(4, 1fr); }
}

/* ---------------- 메뉴 카드 ---------------- */

.menu-card {
  background: var(--bg-card);
  border: 1px solid var(--border-gray);
  border-radius: var(--radius-md);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  height: 100%;
}

.card-image-wrap {
  position: relative;
  width: 100%;
  aspect-ratio: 1 / 1;
  background: #f7f8fa;
  border-bottom: 1px solid var(--border-gray);
  display: flex;
  align-items: center;
  justify-content: center;
}

.card-image-wrap img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  display: block;
}

.image-pending {
  font-size: 13px;
  color: var(--text-mid);
  text-align: center;
  padding: 0 10px;
}

.sold-out-badge {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  border: 2px solid var(--red);
  color: var(--red);
  background: rgba(255, 255, 255, 0.9);
  font-weight: 800;
  font-size: 14px;
  padding: 4px 10px;
  border-radius: var(--radius-sm);
  letter-spacing: 0.03em;
}

.card-body {
  flex: 1;
  display: flex;
  flex-direction: column;

<script>
/* ==========================================================================
   천원의 아침밥 — 오늘의 메뉴 평가 (학생용)
   - 캐릭터 하나를 터치하면 별도 버튼 없이 즉시 저장됩니다.
   - 같은 기기에서는 같은 날짜(KST 기준)에 1회만 평가할 수 있습니다.
   - 문구는 BREAKFAST_RATING_TEXT(js/translations.js)의 번역을 그대로 사용합니다.
   - app.js의 renderBreakfastArea()에서 window.BreakfastRating.render(...)를
     호출하는 방식으로 연결되며, 이 스크립트가 없어도 기존 화면은 그대로
     동작합니다(선택적 연동).
   ========================================================================== */

var BreakfastRating = (function () {
  "use strict";

  var DEVICE_ID_KEY = "foodhall_device_id";
  var RATED_KEY_PREFIX = "foodhall_breakfast_rating_"; // + dateKey(YYYY-MM-DD)
  var SCORES = [5, 4, 3, 2, 1];

  var els = null;
  var busy = false;
  var justRatedDateKey = null; // 이번 화면 방문 중 방금 평가를 마친 날짜(감사 문구용)

  function qs(id) { return document.getElementById(id); }

  function ensureEls() {
    if (els) return els;
    var wrap = qs("baRating");
    if (!wrap) { els = {}; return els; }
    els = {
      wrap: wrap,
      title: qs("baRatingTitle"),
      options: qs("baRatingOptions"),
      message: qs("baRatingMessage")
    };
    return els;
  }

  /* ---------------- 기기 식별 / 하루 1회 제한 (강한 인증이 아닌 단순 중복 방지용) ---------------- */

  function getDeviceId() {
    try {
      var id = localStorage.getItem(DEVICE_ID_KEY);
      if (id) return id;
      id = (window.crypto && typeof crypto.randomUUID === "function")
        ? crypto.randomUUID()
        : ("dev-" + Date.now() + "-" + Math.random().toString(16).slice(2));
      localStorage.setItem(DEVICE_ID_KEY, id);
      return id;
    } catch (e) {
      return "dev-nostorage";
    }
  }

  function getRatedToday(dateKey) {
    try { return localStorage.getItem(RATED_KEY_PREFIX + dateKey); } catch (e) { return null; }
  }

  function setRatedToday(dateKey, score) {
    try { localStorage.setItem(RATED_KEY_PREFIX + dateKey, String(score)); } catch (e) { /* localStorage 미지원 시 무시 */ }
  }

  /* ---------------- 캐릭터 얼굴 SVG (동일 캐릭터, 표정만 5단계로 변화) ---------------- */

  var FACE_SPEC = {
    5: { mouth: "M27,54 Q50,80 73,54 Q50,67 27,54 Z", fill: true, browTilt: 4, eye: "happy" },
    4: { mouth: "M30,56 Q50,70 70,56", fill: false, browTilt: 2, eye: "normal" },
    3: { mouth: "M33,61 L67,61", fill: false, browTilt: 0, eye: "normal" },
    2: { mouth: "M30,68 Q50,58 70,68", fill: false, browTilt: -2, eye: "normal" },
    1: { mouth: "M27,71 Q50,52 73,71", fill: false, browTilt: -4, eye: "sad" }
  };

  function buildFaceSvg(score) {
    var spec = FACE_SPEC[score];
    var browY = 34 - spec.browTilt;

    var eyesSvg;
    if (spec.eye === "happy") {
      eyesSvg =
        '<path d="M23,41 Q31,31 39,41" fill="none" stroke="#1f2328" stroke-width="4" stroke-linecap="round"/>' +
        '<path d="M61,41 Q69,31 77,41" fill="none" stroke="#1f2328" stroke-width="4" stroke-linecap="round"/>';
    } else if (spec.eye === "sad") {
      eyesSvg =
        '<circle cx="31" cy="40" r="4.5" fill="#1f2328"/>' +
        '<circle cx="69" cy="40" r="4.5" fill="#1f2328"/>';
    } else {
      eyesSvg =
        '<circle cx="31" cy="39" r="5" fill="#1f2328"/>' +
        '<circle cx="69" cy="39" r="5" fill="#1f2328"/>';
    }

    var mouthSvg = spec.fill
      ? '<path d="' + spec.mouth + '" fill="#a13a2f"/>'
      : '<path d="' + spec.mouth + '" fill="none" stroke="#1f2328" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>';

    return (
      '<svg viewBox="0 0 100 100" aria-hidden="true" focusable="false">' +
      '<circle cx="50" cy="50" r="46" fill="#ffd166" stroke="#1f2328" stroke-width="3"/>' +
      '<path d="M17,' + browY + ' L39,' + (browY - 3) + '" stroke="#1f2328" stroke-width="4" stroke-linecap="round"/>' +
      '<path d="M61,' + (browY - 3) + ' L83,' + browY + '" stroke="#1f2328" stroke-width="4" stroke-linecap="round"/>' +
      eyesSvg +
      mouthSvg +
      '</svg>'
    );
  }

  /* ---------------- 저장 (Firestore 우선, 미설정 시 기기 저장만) ---------------- */

  function saveRating(score, dateKey, lang, menuText) {
    var db = (typeof getFirestoreDb === "function") ? getFirestoreDb() : null;
    if (!db) {
      // Firebase 미설정 상태: 학생 화면은 정상 동작하되 관리자 통계에는 집계되지 않음
      return Promise.resolve({ local: true });
    }

    var docData = {
      date: dateKey,
      menuId: "breakfast-" + dateKey.replace(/-/g, ""),
      rating: score,
      language: lang,
      deviceId: getDeviceId(),
      mainMenu: menuText || null,
      createdAt: (window.firebase && firebase.firestore && firebase.firestore.FieldValue)
        ? firebase.firestore.FieldValue.serverTimestamp()
        : new Date().toISOString()
    };

    return db.collection("breakfastRatings").add(docData);
  }

  /* ---------------- 렌더링 ---------------- */

  function text(key, lang) {
    var entry = BREAKFAST_RATING_TEXT[key];
    if (!entry) return "";
    return entry[lang] || entry.ko || "";
  }

  function renderOptions(dateKey, lang, menuText) {
    els.options.innerHTML = "";
    SCORES.forEach(function (score) {
      var label = text("score" + score, lang);

      var btn = document.createElement("button");
      btn.type = "button";
      btn.className = "ba-rating-option";
      btn.setAttribute("aria-label", label);

      var faceWrap = document.createElement("span");
      faceWrap.className = "ba-rating-face";
      faceWrap.innerHTML = buildFaceSvg(score);
      btn.appendChild(faceWrap);

      var labelEl = document.createElement("span");
      labelEl.className = "ba-rating-label";
      labelEl.textContent = label;
      btn.appendChild(labelEl);

      btn.addEventListener("click", function () { handlePick(score, dateKey, lang, menuText); });
      els.options.appendChild(btn);
    });
  }

  function showOptions(lang, dateKey, menuText) {
    els.title.hidden = false;
    els.title.textContent = text("title", lang);
    els.options.hidden = false;
    renderOptions(dateKey, lang, menuText);
    els.message.hidden = true;
  }

  function showCompletedOrThanks(lang, dateKey) {
    els.title.hidden = true;
    els.options.hidden = true;
    els.options.innerHTML = "";
    els.message.hidden = false;
    if (justRatedDateKey === dateKey) {
      els.message.className = "ba-rating-message ba-rating-message-thanks";
      els.message.textContent = text("thanks", lang);
    } else {
      els.message.className = "ba-rating-message ba-rating-message-completed";
      els.message.textContent = text("completed", lang);
    }
  }

  function showErrorKeepOptions(lang) {
    Array.prototype.forEach.call(els.options.querySelectorAll(".ba-rating-option"), function (btn) {
      btn.disabled = false;
    });
    els.message.hidden = false;
    els.message.className = "ba-rating-message ba-rating-message-error";
    els.message.textContent = text("error", lang);
    busy = false;
  }

  function handlePick(score, dateKey, lang, menuText) {
    if (busy) return;
    busy = true;
    els.message.hidden = true;
    Array.prototype.forEach.call(els.options.querySelectorAll(".ba-rating-option"), function (btn) {
      btn.disabled = true;
    });

    saveRating(score, dateKey, lang, menuText).then(function () {
      setRatedToday(dateKey, score);
      justRatedDateKey = dateKey;
      busy = false;
      showCompletedOrThanks(lang, dateKey);
    }).catch(function (err) {
      console.error("아침밥 평가 저장 오류:", err);
      showErrorKeepOptions(lang);
    });
  }

  /**
   * @param {string} lang 현재 선택된 언어 (ko/en/zh/vi/mn)
   * @param {boolean} hasTodayMenu 오늘 천원의 아침밥 메뉴가 존재하는지 (주말/휴무 시 false)
   * @param {string} dateKey 오늘 날짜 (Asia/Seoul, YYYY-MM-DD)
   * @param {string} menuText 오늘의 주메뉴(한국어) - 관리자 통계 표시용
   */
  function render(lang, hasTodayMenu, dateKey, menuText) {
    ensureEls();
    if (!els.wrap) return;

    if (!hasTodayMenu || typeof BREAKFAST_RATING_TEXT === "undefined") {
      els.wrap.hidden = true;
      return;
    }
    els.wrap.hidden = false;

    var already = getRatedToday(dateKey);
    if (already) {
      showCompletedOrThanks(lang, dateKey);
      return;
    }
    showOptions(lang, dateKey, menuText);
  }

  return { render: render };
})();

</script>
<script>
/* ==========================================================================
   푸드홀(인제대학교) app.js
   - 매장 선택 / 언어 선택 / 메뉴 그룹 이전·다음 / 천원의 아침밥 모달
   - 외부 라이브러리 없이 순수 JavaScript로 동작합니다.
   ========================================================================== */

(function () {
  "use strict";

  var STORE_ORDER = ["bapsim", "mangwon", "hururuk"];
  var LANG_KEY = "foodhall_lang";
  var SUPPORTED_LANGS = ["ko", "zh", "vi", "en", "mn"];

  var state = {
    store: "bapsim",
    bapsimView: "breakfast",
    groupByStore: { bapsim: 1, mangwon: 1, hururuk: 1 },
    lang: "ko"
  };

  var els = {};

  function qs(id) { return document.getElementById(id); }

  function formatPrice(price, lang) {
    if (price === null || typeof price === "undefined") {
      return { text: UI_TEXT.priceTBD[lang] || UI_TEXT.priceTBD.ko, tbd: true };
    }
    var withComma = price.toLocaleString("ko-KR");
    return { text: withComma + UI_TEXT.won[lang], tbd: false };
  }

  function getGroupsForStore(store) {
    var groups = {};
    MENU_DATA.forEach(function (item) {
      if (item.store === store) groups[item.group] = true;
    });
    return Object.keys(groups).map(Number).sort(function (a, b) { return a - b; });
  }

  function getItems(store, group) {
    return MENU_DATA
      .filter(function (item) { return item.store === store && item.group === group; })
      .sort(function (a, b) { return a.order - b.order; });
  }

  function buildCard(item) {
    var card = document.createElement("div");
    card.className = "menu-card";

    var imgWrap = document.createElement("div");
    imgWrap.className = "card-image-wrap";

    if (item.image) {
      var img = document.createElement("img");
      img.src = item.image;
      img.alt = item.name.ko;
      img.loading = "lazy";
      img.onerror = function () {
        if (imgWrap.dataset.fallbackApplied) return;
        imgWrap.dataset.fallbackApplied = "1";
        imgWrap.innerHTML = "";
        var pending = document.createElement("span");
        pending.className = "image-pending";
        pending.textContent = UI_TEXT.imagePending[state.lang] || UI_TEXT.imagePending.ko;
        imgWrap.appendChild(pending);
      };
      imgWrap.appendChild(img);
    } else {
      var pendingEl = document.createElement("span");
      pendingEl.className = "image-pending";
      pendingEl.textContent = UI_TEXT.imagePending[state.lang] || UI_TEXT.imagePending.ko;
      imgWrap.appendChild(pendingEl);
    }

    if (item.soldOut) {
      var badge = document.createElement("span");
      badge.className = "sold-out-badge";
      badge.textContent = UI_TEXT.soldOut[state.lang] || UI_TEXT.soldOut.ko;
      imgWrap.appendChild(badge);
    }

    card.appendChild(imgWrap);

    var body = document.createElement("div");
    body.className = "card-body";

    var names = document.createElement("div");
    names.className = "card-names";

    var koName = document.createElement("p");
    koName.className = "card-name-ko";
    koName.textContent = item.name.ko;
    names.appendChild(koName);

    if (state.lang !== "ko") {
      var translated = document.createElement("p");
      translated.className = "card-name-translated";
      translated.textContent = item.name[state.lang] || "";
      names.appendChild(translated);
    }

    body.appendChild(names);

    var priceInfo = formatPrice(item.price, state.lang);
    var priceEl = document.createElement("p");
    priceEl.className = "card-price" + (priceInfo.tbd ? " tbd" : "");
    priceEl.textContent = priceInfo.text;
    body.appendChild(priceEl);

    card.appendChild(body);

    return card;
  }

  function renderGrid() {
    var grid = els.menuGrid;
    grid.innerHTML = "";
    var items = getItems(state.store, state.groupByStore[state.store]);
    var frag = document.createDocumentFragment();
    items.forEach(function (item) { frag.appendChild(buildCard(item)); });
    grid.appendChild(frag);
  }

  function renderGroupNav() {
    var groups = getGroupsForStore(state.store);
    if (groups.length <= 1) {
      els.groupNav.hidden = true;
      return;
    }
    els.groupNav.hidden = false;
    var current = state.groupByStore[state.store];
    els.prevBtn.disabled = current <= groups[0];
    els.nextBtn.disabled = current >= groups[groups.length - 1];
    els.groupIndicator.textContent = current + " / " + groups.length;
  }

  function renderHeader() {
    els.siteTitle.textContent = UI_TEXT.siteTitle[state.lang];
    document.title = UI_TEXT.siteTitle[state.lang];

    STORE_ORDER.forEach(function (store) {
      var btn = els.storeTabButtons[store];
      var info = UI_TEXT.storeNames[store];
      btn.innerHTML = "";

      var brandEl = document.createElement("span");
      brandEl.className = "store-tab-brand";
      brandEl.textContent = info.brand;
      btn.appendChild(brandEl);

      var floorEl = document.createElement("span");
      floorEl.className = "store-tab-floor";
      floorEl.textContent = info.floor[state.lang];
      btn.appendChild(floorEl);

      if (state.lang !== "ko") {
        var pronEl = document.createElement("span");
        pronEl.className = "store-tab-pronunciation";
        pronEl.textContent = info.pronunciation[state.lang];
        btn.appendChild(pronEl);
      }

      btn.classList.toggle("active", store === state.store);
      btn.setAttribute("aria-pressed", store === state.store ? "true" : "false");
    });

    SUPPORTED_LANGS.forEach(function (lang) {
      var btn = els.langButtons[lang];
      btn.classList.toggle("active", lang === state.lang);
      btn.setAttribute("aria-pressed", lang === state.lang ? "true" : "false");
    });

    els.storeHeading.textContent = UI_TEXT.storeHeading[state.store][state.lang];
    els.prevBtn.textContent = UI_TEXT.prevButton[state.lang];
    els.nextBtn.textContent = UI_TEXT.nextButton[state.lang];
  }

  function renderAll() {
    try {
      renderHeader();
      renderBapsimSubtabs();
      renderColaBanner();
      renderOwnerChat();
      renderGrid();
      renderGroupNav();
      updateBapsimViewVisibility();
      if (state.store === "bapsim" && state.bapsimView === "breakfast") renderBreakfastArea();
      els.fallbackMsg.hidden = true;
    } catch (err) {
      console.error("메뉴 렌더링 오류:", err);
      els.menuGrid.innerHTML = "";
      els.fallbackMsg.hidden = false;
      els.fallbackMsg.textContent = UI_TEXT.loadError[state.lang] || UI_TEXT.loadError.ko;
    }
  }

  function setStore(store) {
    if (state.store === store) return;
    state.store = store;
    state.bapsimView = "breakfast";
    renderAll();
  }

  function setLang(lang) {
    if (SUPPORTED_LANGS.indexOf(lang) === -1 || state.lang === lang) return;
    state.lang = lang;
    try { localStorage.setItem(LANG_KEY, lang); } catch (e) { /* localStorage 미지원 시 무시 */ }
    renderAll();
    if (!els.colaDetailOverlay.hidden) renderColaDetail();
    if (!els.staffShowOverlay.hidden) renderStaffShow();
  }

  function changeGroup(delta) {
    var groups = getGroupsForStore(state.store);
    var current = state.groupByStore[state.store];
    var idx = groups.indexOf(current);
    var nextIdx = idx + delta;
    if (nextIdx < 0 || nextIdx >= groups.length) return;
    state.groupByStore[state.store] = groups[nextIdx];
    renderGrid();
    renderGroupNav();
  }

  /* ---------------- 날짜 계산 (Asia/Seoul 기준) ---------------- */

  var SEOUL_TZ = "Asia/Seoul";
  var DATE_LOCALE_MAP = { ko: "ko-KR", en: "en-US", zh: "zh-CN", vi: "vi-VN", mn: "mn-MN" };

  function seoulInstant(offsetDays) {
    return new Date(Date.now() + (offsetDays || 0) * 24 * 60 * 60 * 1000);
  }

  function getSeoulDateKey(offsetDays) {
    return new Intl.DateTimeFormat("en-CA", {
      timeZone: SEOUL_TZ, year: "numeric", month: "2-digit", day: "2-digit"
    }).format(seoulInstant(offsetDays));
  }

  function isSeoulWeekend(offsetDays) {
    var weekday = new Intl.DateTimeFormat("en-US", { timeZone: SEOUL_TZ, weekday: "long" }).format(seoulInstant(offsetDays));
    return weekday === "Saturday" || weekday === "Sunday";
  }

  function formatSeoulDateDisplay(lang, offsetDays) {
    var locale = DATE_LOCALE_MAP[lang] || "ko-KR";
    var opts = { timeZone: SEOUL_TZ, month: "long", day: "numeric", weekday: "long" };
    try {
      return new Intl.DateTimeFormat(locale, opts).format(seoulInstant(offsetDays));
    } catch (e) {
      return new Intl.DateTimeFormat("ko-KR", opts).format(seoulInstant(offsetDays));
    }
  }

  /* ---------------- 밥심 서브탭 (일반 메뉴 / 천원의 아침밥) ---------------- */

  function renderBapsimSubtabs() {
    var show = state.store === "bapsim";
    els.bapsimSubtabs.hidden = !show;
    if (!show) return;

    var lang = state.lang;
    els.bapsimTabMenu.textContent = BREAKFAST_INFO.tabLabel[lang];
    els.bapsimTabBreakfast.textContent = BREAKFAST_INFO.title[lang];

    els.bapsimTabMenu.classList.toggle("active", state.bapsimView === "menu");
    els.bapsimTabMenu.setAttribute("aria-pressed", state.bapsimView === "menu" ? "true" : "false");
    els.bapsimTabBreakfast.classList.toggle("active", state.bapsimView === "breakfast");
    els.bapsimTabBreakfast.setAttribute("aria-pressed", state.bapsimView === "breakfast" ? "true" : "false");
  }

  function setBapsimView(view) {
    if (state.bapsimView === view) return;
    state.bapsimView = view;
    renderBapsimSubtabs();
    updateBapsimViewVisibility();
    if (view === "breakfast") renderBreakfastArea();
  }

  function updateBapsimViewVisibility() {
    var showBreakfast = state.store === "bapsim" && state.bapsimView === "breakfast";
    els.breakfastArea.hidden = !showBreakfast;
    els.menuGrid.hidden = showBreakfast;
    els.groupNav.hidden = showBreakfast || getGroupsForStore(state.store).length <= 1;
  }

  /* ---------------- 천원의 아침밥 전용 영역 (오늘·내일) ---------------- */

  function renderMealList(listEl, lang, offsetDays, closedText) {
    var dateKey = getSeoulDateKey(offsetDays);
    var day = BREAKFAST_WEEKLY_MENU && BREAKFAST_WEEKLY_MENU.days ? BREAKFAST_WEEKLY_MENU.days[dateKey] : null;

    listEl.innerHTML = "";

    if (isSeoulWeekend(offsetDays) || !day) {
      var closedP = document.createElement("p");
      closedP.className = "today-meal-closed";
      closedP.textContent = closedText;
      listEl.appendChild(closedP);
      return;
    }

    var order = ["rice", "soup", "main", "side1", "side2", "kimchi"];
    var anyLine = false;
    order.forEach(function (key) {
      var field = day[key];
      if (!field) return;
      var text = field[lang] || field.ko;
      if (!text) return;
      anyLine = true;
      var li = document.createElement("li");
      li.textContent = text;
      listEl.appendChild(li);
    });

    if (!anyLine) {
      var closedP2 = document.createElement("p");
      closedP2.className = "today-meal-closed";
      closedP2.textContent = closedText;
      listEl.appendChild(closedP2);
    }
  }

  function renderBreakfastArea() {
    if (state.store !== "bapsim" || state.bapsimView !== "breakfast") return;
    var lang = state.lang;
    var info = BREAKFAST_INFO;
    var labels = info.fieldLabels;

    els.baTitle.textContent = info.title[lang];
    els.baPriceValue.textContent = info.price[lang];

    els.baTodayMenuTitle.textContent = info.todayMenuTitle[lang];
    els.baTodayDateValue.textContent = formatSeoulDateDisplay(lang, 0);
    renderMealList(els.todayMealList, lang, 0, info.todayClosedMessage[lang] || info.todayClosedMessage.ko);
    renderBreakfastRating(lang);

    els.baTomorrowMenuTitle.textContent = info.tomorrowMenuTitle[lang];
    els.baTomorrowDateValue.textContent = formatSeoulDateDisplay(lang, 1);
    renderMealList(els.tomorrowMealList, lang, 1, info.tomorrowClosedMessage[lang] || info.tomorrowClosedMessage.ko);

    els.baHoursLabel.textContent = labels.hours[lang];
    els.baHoursValue.textContent = info.hours[lang];

    els.baEligLabel.textContent = labels.eligibility[lang];
    els.baEligList.innerHTML = "";
    info.eligibility[lang].forEach(function (line) {
      var li = document.createElement("li");
      li.textContent = line;
      els.baEligList.appendChild(li);
    });

    els.baStepsLabel.textContent = labels.steps[lang];
    els.baStepsList.innerHTML = "";
    info.steps[lang].forEach(function (line) {
      var li = document.createElement("li");
      li.textContent = line;
      els.baStepsList.appendChild(li);
    });

    var hasImage = !!(BREAKFAST_WEEKLY_MENU && BREAKFAST_WEEKLY_MENU.sourceImage);
    els.baViewOriginalBtn.hidden = !hasImage;
    if (hasImage) {
      els.baViewOriginalBtn.textContent = info.viewOriginalButton[lang];
    }
  }

  /* "오늘의 메뉴 평가" 위젯 연동 (js/breakfast-rating.js, 선택적 모듈) */
  function renderBreakfastRating(lang) {
    if (!window.BreakfastRating || typeof window.BreakfastRating.render !== "function") return;
    var dateKey = getSeoulDateKey(0);
    var day = BREAKFAST_WEEKLY_MENU && BREAKFAST_WEEKLY_MENU.days ? BREAKFAST_WEEKLY_MENU.days[dateKey] : null;
    var hasTodayMenu = !isSeoulWeekend(0) && !!(day && (day.main || day.rice || day.soup));
    var menuText = day && day.main ? day.main.ko : "";
    window.BreakfastRating.render(lang, hasTodayMenu, dateKey, menuText);
  }

  /* 자정이 지나 날짜가 바뀌면 화면을 새로고침 없이 갱신 */
  var lastKnownSeoulDateKey = null;
  function checkMidnightRollover() {
    var currentKey = getSeoulDateKey(0);
    if (lastKnownSeoulDateKey === null) {
      lastKnownSeoulDateKey = currentKey;
      return;
    }
    if (currentKey !== lastKnownSeoulDateKey) {
      lastKnownSeoulDateKey = currentKey;
      if (state.store === "bapsim" && state.bapsimView === "breakfast") renderBreakfastArea();
    }
  }

  /* ---------------- 주간 메뉴 원본 이미지 팝업 ---------------- */

  var weeklyImageLastFocusedEl = null;

  function openWeeklyImage() {
    if (!BREAKFAST_WEEKLY_MENU || !BREAKFAST_WEEKLY_MENU.sourceImage) return;
    els.weeklyImageImg.src = BREAKFAST_WEEKLY_MENU.sourceImage;
    els.weeklyImageImg.alt = BREAKFAST_INFO.viewOriginalButton[state.lang];
    weeklyImageLastFocusedEl = document.activeElement;
    els.weeklyImageOverlay.hidden = false;
    els.weeklyImageClose.focus();
    document.addEventListener("keydown", onWeeklyImageKeydown);
  }

  function closeWeeklyImage() {
    els.weeklyImageOverlay.hidden = true;
    document.removeEventListener("keydown", onWeeklyImageKeydown);
    if (weeklyImageLastFocusedEl && typeof weeklyImageLastFocusedEl.focus === "function") weeklyImageLastFocusedEl.focus();
  }

  function onWeeklyImageKeydown(e) {
    if (e.key === "Escape") closeWeeklyImage();
  }

  /* ---------------- 무료 콜라 쿠폰 배너 ---------------- */

  function renderColaBanner() {
    var eligible = COLA_COUPON.eligibleStores.indexOf(state.store) !== -1;
    els.colaBanner.hidden = !eligible;
    if (!eligible) return;
    var lang = state.lang;
    els.colaBannerTitle.textContent = "\uD83C\uDF81 " + COLA_COUPON.banner.title[lang];
    els.colaBannerSubtitle.textContent = COLA_COUPON.banner.subtitle[lang];
    els.colaBannerBtn.textContent = COLA_COUPON.banner.button[lang];
  }

  /* ---------------- 콜라 쿠폰 상세창 ---------------- */

  function renderColaDetail() {
    var lang = state.lang;
    var d = COLA_COUPON.detail;

    els.colaDetailTitle.textContent = d.title[lang];
    els.colaDetailSubtitle.textContent = d.subtitle[lang];

    els.colaStoresLabel.textContent = d.storesLabel[lang];
    els.colaStoresList.innerHTML = "";
    d.stores.forEach(function (store) {
      var li = document.createElement("li");
      li.textContent = store.brand + " " + store.floor[lang];
      els.colaStoresList.appendChild(li);
    });

    els.colaConditionLabel.textContent = d.conditionLabel[lang];
    els.colaConditionList.innerHTML = "";
    d.conditions[lang].forEach(function (line) {
      var li = document.createElement("li");
      li.textContent = line;
      els.colaConditionList.appendChild(li);
    });

    els.colaCountLabel.textContent = d.countLabel[lang];
    els.colaCountValue.textContent = d.count[lang];

    els.colaHowToLabel.textContent = d.howToLabel[lang];
    els.colaHowToValue.textContent = d.howTo[lang];

    els.colaCaptureLabel.textContent = d.captureLabel[lang];
    els.colaCaptureValue.textContent = d.capture[lang];

    els.colaPeriodLabel.textContent = d.periodLabel[lang];
    els.colaPeriodValue.textContent = d.period[lang];

    els.colaNotesList.innerHTML = "";
    d.notes[lang].forEach(function (line) {
      var li = document.createElement("li");
      li.textContent = "\u203B " + line;
      els.colaNotesList.appendChild(li);
    });

    els.colaShowStaffBtn.textContent = d.showButton[lang];
    els.colaDetailCloseBtn.textContent = d.closeButton[lang];
  }

  var colaLastFocusedEl = null;

  function openColaDetail() {
    renderColaDetail();
    colaLastFocusedEl = document.activeElement;
    els.colaDetailOverlay.hidden = false;
    els.colaDetailClose.focus();
    document.addEventListener("keydown", onColaDetailKeydown);
  }

  function closeColaDetail() {
    els.colaDetailOverlay.hidden = true;
    document.removeEventListener("keydown", onColaDetailKeydown);
    if (colaLastFocusedEl && typeof colaLastFocusedEl.focus === "function") colaLastFocusedEl.focus();
  }

  function onColaDetailKeydown(e) {
    if (e.key === "Escape") closeColaDetail();
  }

  /* ---------------- 직원에게 보여주기 화면 ---------------- */

  function renderStaffShow() {
    var lang = state.lang;
    var s = COLA_COUPON.staffShow;
    els.staffShowTitle.textContent = s.title[lang];
    els.staffShowSubtitle.textContent = s.subtitle[lang];
    els.staffShowStoresLabel.textContent = s.storesLabel[lang];
    els.staffShowStoresValue.textContent = s.storesValue;
    els.staffShowPeriod.textContent = s.period[lang];
  }

  var staffShowLastFocusedEl = null;

  function openStaffShow() {
    renderStaffShow();
    staffShowLastFocusedEl = document.activeElement;
    els.staffShowOverlay.hidden = false;
    els.staffShowClose.focus();
    document.addEventListener("keydown", onStaffShowKeydown);
  }

  function closeStaffShow() {
    els.staffShowOverlay.hidden = true;
    document.removeEventListener("keydown", onStaffShowKeydown);
    if (staffShowLastFocusedEl && typeof staffShowLastFocusedEl.focus === "function") staffShowLastFocusedEl.focus();
  }

  function onStaffShowKeydown(e) {
    if (e.key === "Escape") closeStaffShow();
  }

  /* ---------------- 사장님께 말해요 ---------------- */

  function renderOwnerChat() {
    var lang = state.lang;
    els.ownerChatTitle.textContent = OWNER_CHAT.title[lang];
    els.ownerChatDescLine1.textContent = OWNER_CHAT.desc[lang][0];
    els.ownerChatDescLine2.textContent = OWNER_CHAT.desc[lang][1];
    els.ownerChatBtnLabel.textContent = OWNER_CHAT.button[lang];
    els.ownerChatFabLabel.textContent = OWNER_CHAT.title[lang];
  }

  /* ---------------- 초기화 ---------------- */

  function loadSavedLang() {
    try {
      var saved = localStorage.getItem(LANG_KEY);
      if (saved && SUPPORTED_LANGS.indexOf(saved) !== -1) return saved;
    } catch (e) { /* localStorage 미지원 시 무시 */ }
    return "ko";
  }

  function init() {
    els.siteTitle = qs("siteTitle");
    els.storeTabs = qs("storeTabs");
    els.storeHeading = qs("storeHeading");
    els.menuGrid = qs("menuGrid");
    els.groupNav = qs("groupNav");
    els.prevBtn = qs("prevBtn");
